[package]
name = "lyricmotion-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
roxmltree = "=0.20.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_yaml_ng = "=0.10.0"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
unicode-normalization = "=0.1.25"
yaml-rust2 = "=0.13.2"
