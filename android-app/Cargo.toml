[package]
name = "lyricmotion-android"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Eonara for Android — native WGPU synchronized lyric visualizer"

[lib]
crate-type = ["cdylib"]

[dependencies]
lyricmotion-core = { path = "../core" }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "=0.22.4"
cosmic-text = "=0.19.0"
log = "0.4"
ndk = "0.9"
pollster = "=0.4.0"
raw-window-handle = "=0.6.2"
wgpu = { version = "=29.0.4", default-features = false, features = ["gles", "vulkan", "wgsl"] }
